<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente corporativo Medipiel: Turquesa vibrante a Petróleo profundo -->
    <linearGradient id="medipielGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2DCCD3" />
      <stop offset="55%" stop-color="#129AA6" />
      <stop offset="100%" stop-color="#01606D" />
    </linearGradient>

    <!-- Sombra sutil para definición en pestañas claras y oscuras -->
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#01363E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Gota característica Medipiel con contorno sutil de alto contraste -->
  <path 
    d="M 32 4 C 32 4 9 26 9 42 A 23 23 0 0 0 55 42 C 55 26 32 4 32 4 Z" 
    fill="url(#medipielGrad)" 
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-opacity="0.4"
    filter="url(#tabShadow)"
  />

  <!-- Brillo dermatológico / gota de agua en la parte superior izquierda -->
  <path 
    d="M 32 8 C 30 13 18 26 16 36 C 15 32 20 20 29 11 Z" 
    fill="#ffffff" 
    opacity="0.38"
  />

  <!-- Símbolo '5S' perfectamente centrado con máxima legibilidad en pestaña -->
  <text 
    x="32" 
    y="43.5" 
    font-family="system-ui, -apple-system, 'Outfit', 'Segoe UI', Roboto, sans-serif" 
    font-size="20" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle" 
    dominant-baseline="central"
    letter-spacing="-0.5"
  >5S</text>
</svg>
